<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ihouse – Aplicație</title>
<link rel="icon" href="pagelogo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#189947;--gd:#0c5a29;--ink:#17201b;--mut:#56645b;--paper:#f3f7f4;--lamp:#ffe58a;--line:#d9e3dc;--red:#c4302b}
*{box-sizing:border-box;margin:0}
body{font-family:Sora,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--paper);line-height:1.55}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hide{display:none!important}
.b{border:0;background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:10px 20px;border-radius:40px;cursor:pointer}
.b:hover{background:var(--g)}
.b.o{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.b.o:hover{background:var(--ink);color:#fff}
.b.s{padding:6px 14px;font-size:13px}
.b.r{background:#fff;color:var(--red);border:2px solid var(--red)}
.b.r:hover{background:var(--red);color:#fff}
input[type=text],input[type=email],input[type=password],input[type=number]{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;width:100%}
input:focus{border-color:var(--g);outline:none}
#login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
#login .pane{background:var(--g);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:flex-end}
#login .pane h1{font-size:clamp(34px,4.4vw,58px);line-height:1.02;letter-spacing:-.045em;font-weight:800}
#login .pane p{margin-top:16px;color:#eaf8ee;max-width:24em}
#login form{background:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;max-width:460px;width:100%;margin:auto}
#login form img{height:32px;align-self:flex-start;margin-bottom:32px}
#login h2{font-size:24px;letter-spacing:-.03em;margin-bottom:20px}
#login label{font-weight:600;font-size:14px;margin:12px 0 6px}
#login form .b{margin-top:24px;padding:14px}
#login small{margin-top:14px;color:var(--mut);font-size:13px}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
aside img{height:28px;align-self:flex-start;margin:0 8px 26px}
aside button.nv{text-align:left;background:none;border:0;padding:12px 14px;border-radius:12px;cursor:pointer;font-weight:600;color:var(--mut);display:flex;justify-content:space-between;align-items:center}
aside button.nv:hover{background:var(--paper)}
aside button.nv.on{background:var(--g);color:#fff}
.badge{background:var(--red);color:#fff;border-radius:20px;font-size:12px;padding:0 8px;line-height:20px}
aside .bt{margin-top:auto;display:grid;gap:6px}
aside .bt a{font-size:13px;color:var(--mut);padding:0 14px;text-decoration:none}
main{padding:36px 40px 80px;max-width:900px;width:100%}
main h1{font-size:28px;letter-spacing:-.035em;font-weight:800;margin-bottom:22px}
.hero{border-radius:24px;padding:32px;background:var(--g);color:#fff;display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.hero.z{background:var(--gd)}
.hero .num{font-size:88px;font-weight:800;letter-spacing:-.05em;line-height:1}
.hero .t{flex:1;min-width:200px}
.hero .t b{display:block;font-size:20px}
.hero .t span{font-size:14px;color:#dff3e5}
.hero .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero .b{background:#fff;color:var(--ink)}
.hero .b:hover{background:var(--lamp)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.box{background:#fff;border-radius:20px;padding:22px;border:1px solid var(--line)}
.box h2{font-size:16px;margin-bottom:10px}
.box p,.box li{font-size:14px;color:var(--mut)}
.box ul{padding-left:18px}
.sw{position:relative;width:52px;height:30px;border-radius:15px;border:0;background:#c3cec7;cursor:pointer;flex:none;transition:background .15s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true]{background:var(--g)}
.sw[aria-checked=true]:after{transform:translateX(22px)}
.ln{display:flex;justify-content:space-between;align-items:center;gap:14px}
.sec{margin:26px 0 12px;font-size:18px;font-weight:600;display:flex;align-items:baseline;gap:10px}
.sec small{color:var(--mut);font-size:13px;font-weight:400}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{border:2px solid var(--line);background:#fff;border-radius:18px;padding:16px;text-align:left;cursor:pointer;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;transition:background .2s,border-color .2s}
.tile.on{background:var(--lamp);border-color:#e2bd3a}
.tile b{font-size:15px;line-height:1.25}
.tile small{color:var(--mut);font-size:12px}
.tile .st{font-weight:600;font-size:13px}
.thread{display:grid;gap:12px;max-width:560px}
.m{padding:12px 16px;border-radius:18px;font-size:15px;max-width:90%}
.m.bot{background:#fff;border:1px solid var(--line);border-top-left-radius:4px}
.m.me{background:var(--g);color:#fff;justify-self:end;border-top-right-radius:4px}
.m.sys{justify-self:center;background:none;color:var(--mut);font-size:13px;text-align:center}
.m time{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.m .q{display:flex;gap:8px;margin-top:10px}
.set{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}
.set h3{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.set h3 input{font-weight:600}
.dr{display:grid;grid-template-columns:1fr 110px auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dr label{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center;white-space:nowrap}
.dr input[type=checkbox]{width:18px;height:18px;accent-color:var(--g)}
.dr small{display:block;font-size:11px;color:var(--mut)}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;min-width:0}
.add select{border:2px solid var(--line);border-radius:12px;padding:0 10px;font:inherit;background:#fff}
@media(max-width:800px){
#login{grid-template-columns:1fr}#login .pane{display:none}#login form{padding:32px 24px}
#app{grid-template-columns:1fr}
aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;padding:6px;z-index:5;border-top:1px solid var(--line);border-right:0}
aside img,aside .bt{display:none}
aside button.nv{flex:1;justify-content:center;padding:10px 4px;font-size:13px;gap:6px}
main{padding:24px 18px 100px}.two{grid-template-columns:1fr}.dr{grid-template-columns:1fr 90px}
}
</style>
</head>
<body>
<div id="login">
<div class="pane"><h1>Casa ta știe când ai plecat.</h1><p>Intră în cont ca să controlezi luminile, prizele și răspunsurile lui iBot.</p></div>
<form id="lf">
<img src="images/logo.png" alt="ihouse">
<h2>Intră în contul casei</h2>
<label for="em">Email</label><input id="em" type="email" required autocomplete="username" placeholder="nume@exemplu.ro">
<label for="pw">Parolă</label><input id="pw" type="password" required autocomplete="current-password">
<button class="b" type="submit">Intră în cont</button>
<small>Versiune demo: orice date sunt acceptate și nu părăsesc browserul.</small>
</form>
</div>

<div id="app" class="hide">
<aside>
<img src="images/logo.png" alt="ihouse">
<button class="nv" data-v="home">Acasă</button>
<button class="nv" data-v="rooms">Camere</button>
<button class="nv" data-v="ibot">iBot <span class="badge hide" id="bd"></span></button>
<button class="nv" data-v="set">Setări</button>
<div class="bt"><a href="index1.html">Pagina de prezentare</a><button class="b o s" id="out">Ieși din cont</button></div>
</aside>
<main id="view"></main>
</div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var KEY='ihouse1-state',SCALE=60,uid=100,view='home';
var def={count:2,off:false,chat:[],rooms:[
{id:1,name:'Sufragerie',devices:[{id:1,name:'Bec tavan',type:'light',on:true,check:60},{id:2,name:'Televizor',type:'socket',on:true,check:0},{id:3,name:'Lampa de citit',type:'socket',on:false,check:0}]},
{id:2,name:'Bucătărie',devices:[{id:4,name:'Bec bucătărie',type:'light',on:true,check:30},{id:5,name:'Frigider',type:'socket',on:true,check:0,essential:true},{id:6,name:'Espressor',type:'socket',on:false,check:0}]},
{id:3,name:'Dormitor',devices:[{id:7,name:'Bec dormitor',type:'light',on:false,check:0}]}]};
var S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.rooms)S=JSON.parse(JSON.stringify(def));
S.rooms.forEach(function(r){r.devices.forEach(function(d){if(d.on&&!d.since)d.since=Date.now()})});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function tm(){return new Date().toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'})}
function sys(t){S.chat.push({id:++uid,dev:0,text:t,time:tm(),sys:true})}
function find(id){var f=null;S.rooms.forEach(function(r){r.devices.forEach(function(d){if(d.id==id)f=d})});return f}
function setDev(d,on){d.on=on;d.since=on?Date.now():null;d.asked=false}
function offOn(){S.off=true;S.rooms.forEach(function(r){r.devices.forEach(function(d){if(!d.essential&&d.on)setDev(d,false)})});sys('Modul OFF activat: luminile și prizele neesențiale s-au oprit.')}
function setCount(n){S.count=Math.max(0,n);if(S.count===0&&!S.off)offOn();else if(S.count>0&&S.off){S.off=false;sys('Cineva a intrat: Modul OFF s-a dezactivat.')}}
function pending(){return S.chat.filter(function(m){return !m.sys&&!m.done}).length}
function onList(){var a=[];S.rooms.forEach(function(r){r.devices.forEach(function(d){if(d.on)a.push(d.name+' ('+r.name+')')})});return a}

function render(){
  document.querySelectorAll('.nv').forEach(function(b){b.classList.toggle('on',b.dataset.v===view)});
  var p=pending(),bd=$('#bd');bd.textContent=p;bd.classList.toggle('hide',!p);
  var h='';
  if(view==='home'){
    var z=S.count===0,l=onList();
    h='<h1>Acasă</h1><div class="hero'+(z?' z':'')+'"><div class="num">'+S.count+'</div><div class="t"><b>'+(z?'Persoane în casă: 0 – Mod OFF activat':'Persoane în casă: '+S.count)+'</b><span>Numărate de cele două lasere de la intrare.</span><div class="row"><button class="b s" data-a="in">Simulează intrare</button><button class="b s" data-a="exit">Simulează ieșire</button></div></div></div>'+
    '<div class="two"><div class="box"><div class="ln"><div><h2>Modul OFF</h2><p>'+(S.off?'Activ: consumul neesențial e oprit.':'Oprit: casa funcționează normal.')+'</p></div><button class="sw" role="switch" aria-label="Modul OFF" aria-checked="'+S.off+'" data-a="off"></button></div></div>'+
    '<div class="box"><h2>Aprinse acum: '+l.length+'</h2>'+(l.length?'<ul>'+l.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'<p>Nimic nu consumă în acest moment.</p>')+'</div></div>';
  }else if(view==='rooms'){
    h='<h1>Camere</h1>'+S.rooms.map(function(r){
      return '<div class="sec">'+esc(r.name)+'<small>Atinge un echipament ca să-l aprinzi sau să-l stingi</small></div><div class="tiles">'+(r.devices.length?r.devices.map(function(d){
        return '<button class="tile'+(d.on?' on':'')+'" data-a="tg" data-d="'+d.id+'" aria-pressed="'+d.on+'"><b>'+esc(d.name)+'</b><span><span class="st">'+(d.on?'Pornit':'Oprit')+'</span><br><small>'+(d.type==='light'?'Bec':'Priză')+(d.essential?' esențială':'')+'</small></span></button>'}).join(''):'<p style="color:var(--mut)">Camera nu are echipamente. Adaugă-le din Setări.</p>')+'</div>'}).join('')||'<p>Nu ai nicio cameră. Adaug-o din Setări.</p>';
  }else if(view==='ibot'){
    h='<h1>iBot</h1><div class="thread">'+(S.chat.length?S.chat.slice().reverse().map(function(m){
      if(m.sys)return '<div class="m sys">'+esc(m.text)+' · '+m.time+'</div>';
      var s='<div class="m bot">'+esc(m.text)+'<time>'+m.time+'</time>'+(m.done?'':'<div class="q"><button class="b s" data-a="nstop" data-n="'+m.id+'">Stinge</button><button class="b o s" data-a="nkeep" data-n="'+m.id+'">Las aprinsă</button></div>')+'</div>';
      return s+(m.done?'<div class="m me">'+esc(m.done)+'</div>':'')}).join(''):'<div class="m bot">Nu am întrebări acum. Te anunț când un echipament stă aprins mai mult decât timpul setat.</div>')+'</div>';
  }else{
    h='<h1>Setări</h1>'+S.rooms.map(function(r){
      return '<div class="set"><h3><input type="text" value="'+esc(r.name)+'" data-k="rn" data-r="'+r.id+'" aria-label="Numele camerei"><button class="b r s" data-a="dr" data-r="'+r.id+'">Șterge camera</button></h3>'+
      r.devices.map(function(d){return '<div class="dr"><div><input type="text" value="'+esc(d.name)+'" data-k="dn" data-d="'+d.id+'" aria-label="Nume echipament"><small>'+(d.type==='light'?'Bec':'Priză')+'</small></div><div><input type="number" min="0" value="'+d.check+'" data-k="ck" data-d="'+d.id+'" aria-label="Minute pentru check"><small>minute check</small></div><label><input type="checkbox" data-k="es" data-d="'+d.id+'"'+(d.essential?' checked':'')+'>Esențial</label><button class="b r s" data-a="dd" data-d="'+d.id+'">Șterge</button></div>'}).join('')+
      '<div class="add"><input type="text" placeholder="Echipament nou" aria-label="Echipament nou"><select aria-label="Tip"><option value="light">Bec</option><option value="socket">Priză</option></select><button class="b s" data-a="ad" data-r="'+r.id+'">Adaugă</button></div></div>'}).join('')+
      '<div class="set"><div class="add" style="margin:0"><input type="text" id="nr" placeholder="Cameră nouă (ex: Birou)" aria-label="Cameră nouă"><button class="b s" data-a="ar">Adaugă camera</button></div></div><p style="font-size:13px;color:var(--mut)">Check 0 înseamnă că iBot nu întreabă. În demo, 1 secundă reprezintă 1 minut.</p>';
  }
  $('#view').innerHTML=h;save();
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a],[data-v]');if(!b)return;
  if(b.dataset.v){view=b.dataset.v;render();return}
  var a=b.dataset.a,d=b.dataset.d?find(b.dataset.d):null,r=S.rooms.filter(function(x){return x.id==b.dataset.r})[0],m=S.chat.filter(function(x){return x.id==b.dataset.n})[0];
  if(a==='in')setCount(S.count+1);
  else if(a==='exit')setCount(S.count-1);
  else if(a==='off'){if(S.off){S.off=false;sys('Modul OFF dezactivat manual.')}else offOn()}
  else if(a==='tg')setDev(d,!d.on);
  else if(a==='nstop'&&m){setDev(find(m.dev),false);m.done='Stinge'}
  else if(a==='nkeep'&&m){var x=find(m.dev);x.since=Date.now();x.asked=false;m.done='Las aprinsă'}
  else if(a==='dr'){if(confirm('Ștergi camera „'+r.name+'” și tot ce conține?'))S.rooms=S.rooms.filter(function(y){return y!==r})}
  else if(a==='dd')S.rooms.forEach(function(y){y.devices=y.devices.filter(function(z){return z!==d})});
  else if(a==='ad'){var i=b.parentNode.querySelector('input');if(!i.value.trim()){i.focus();return}r.devices.push({id:++uid,name:i.value.trim(),type:b.parentNode.querySelector('select').value,on:false,check:0})}
  else if(a==='ar'){var n=$('#nr');if(!n.value.trim()){n.focus();return}S.rooms.push({id:++uid,name:n.value.trim(),devices:[]})}
  render();
});
document.addEventListener('change',function(e){
  var t=e.target,k=t.dataset.k;if(!k)return;
  if(k==='rn'){var r=S.rooms.filter(function(x){return x.id==t.dataset.r})[0];if(t.value.trim())r.name=t.value.trim()}
  else{var d=find(t.dataset.d);
    if(k==='dn'&&t.value.trim())d.name=t.value.trim();
    if(k==='ck'){d.check=Math.max(0,Math.round(+t.value||0));d.asked=false;if(d.on)d.since=Date.now()}
    if(k==='es')d.essential=t.checked}
  save();
});
$('#lf').onsubmit=function(e){e.preventDefault();try{sessionStorage.setItem('ihouse1-in','1')}catch(x){}show(true)};
$('#out').onclick=function(){try{sessionStorage.removeItem('ihouse1-in')}catch(x){}show(false)};
function show(v){$('#login').classList.toggle('hide',v);$('#app').classList.toggle('hide',!v);if(v)render()}
var ok=false;try{ok=sessionStorage.getItem('ihouse1-in')==='1'}catch(e){}
show(ok);

setInterval(function(){
  var ch=false,now=Date.now();
  S.rooms.forEach(function(r){r.devices.forEach(function(d){
    if(d.on&&d.check>0&&!d.asked&&d.since&&(now-d.since)/1000*SCALE/60>=d.check){
      d.asked=true;S.chat.push({id:++uid,dev:d.id,text:'Mai folosești '+d.name.toLowerCase()+'? Nu a mai fost stinsă de '+d.check+' minute.',time:tm(),done:null});ch=true}
  })});
  if(ch&&!$('#app').classList.contains('hide')&&view!=='set')render();else if(ch)save();
},1000);
})();
</script>
</body>
</html>
