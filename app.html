body{font-family:Sora,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--paper);line-height:1.55}

.b{border:0;background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:10px 20px;border-radius:40px;cursor:pointer}

.sw{position:relative;width:52px;height:30px;border-radius:15px;border:0;background:#c3cec7;cursor:pointer;flex:none;transition:background .15s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true]{background:var(--g)}

.ln{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.sec{margin:26px 0 12px;font-size:18px;font-weight:600;display:flex;align-items:baseline;gap:10px}

.ov{position:fixed;inset:0;background:rgba(23,32,27,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}

body{overflow-x:hidden}
img{max-width:100%}

.chart{display:grid;gap:10px;margin-bottom:20px}
.cb-row{display:grid;grid-template-columns:110px 1fr 74px;gap:10px;align-items:center;font-size:13px}
.cb-label{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-track{background:var(--paper);border:1px solid var(--line);border-radius:10px;height:16px;overflow:hidden}
.cb-fill{background:var(--g);height:100%;border-radius:10px;transition:width .3s}
.cb-val{text-align:right;font-weight:600;white-space:nowrap}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.priceIn{width:64px;border:2px solid var(--line);border-radius:10px;padding:4px 8px;font:inherit;background:#fff;margin-left:6px}
.ibot-bar{position:sticky;top:0;background:var(--paper);z-index:3;padding:8px 0 14px}
.ibotWrap{position:relative}

}

async function push(){

      else if(snap[key+o.id]!==j){var y=await SB.from(tab).update(row).eq('id',o.id);if(y.error)throw y.error}
      snap[key+o.id]=j;seen[key+o.id]=1;
    };
    for(var a=0;a<S.types.length;a++)await up('device_types','t',S.types[a],tRow(S.types[a]));

    for(var c=0;c<S.chat.length;c++)await up('ibot_messages','m',S.chat[c],mRow(S.chat[c]));
    S.sched.forEach(function(x){if(idm[x.dev])x.dev=idm[x.dev]});
    try{for(var q2=0;q2<S.sched.length;q2++)await up('schedules','s',S.sched[q2],scRow(S.sched[q2]))}catch(x2){console.warn('schedules:',x2.message||x2);S.sched.forEach(function(x){seen['s'+x.id]=1})}
    var tabs={t:'device_types',r:'rooms',d:'devices',m:'ibot_messages',s:'schedules'};
    for(var key in snap){if(!seen[key]){var z=await SB.from(tabs[key[0]]).delete().eq('id',key.slice(1));if(z.error)throw z.error;delete snap[key]}}
    var sj=JSON.stringify(sRow());
    if(sj!==sSnap){var u=await SB.from('settings').update(sRow()).eq('id',1);if(u.error)throw u.error;sSnap=sj}

function ibotReply(t){
  var low=t.toLowerCase();
  var tmm=low.match(/peste\s+(\d+(?:[.,]\d+)?)\s*(?:de\s+)?(ore|ora|oră|h|min\w*)/);
  if(tmm&&/stinge|opre[sș]te|aprinde|porne[sș]te/.test(low)){
    var mins=parseFloat(tmm[1].replace(',','.'))*(/^(ore|ora|oră|h)$/.test(tmm[2])?60:1),son=/aprinde|porne[sș]te/.test(low),shit=[];
    S.rooms.forEach(function(r){r.devices.forEach(function(d){if(low.indexOf(d.name.toLowerCase())>-1)shit.push(d)})});
    if(!shit.length)S.rooms.forEach(function(r){if(low.indexOf(r.name.toLowerCase())>-1)r.devices.forEach(function(d){shit.push(d)})});
    if(!shit.length)return 'Spune-mi ce echipament să programez, de exemplu „stinge lumina din bucătărie peste 20 de minute”.';
    shit=shit.filter(function(d){return son||!d.essential});
    if(!shit.length)return 'Echipamentele esențiale, precum frigiderul, nu se opresc.';
    shit.forEach(function(d){addSched(d,son,mins)});
    return 'Gata, voi '+(son?'porni ':'stinge ')+shit.map(function(d){return d.name.toLowerCase()}).join(', ')+' peste '+(mins>=120?n2(mins/60)+' ore':Math.round(mins)+' minute')+'.';
  }
  if(/economis|salv[ae]|reduce.*consum|factur/.test(low)){
    var all=[];S.rooms.forEach(function(r){r.devices.forEach(function(d){if(kwh(d)>0&&!d.essential&&!d.heart)all.push({d:d,r:r,k:kwh(d)})})});
    all.sort(function(a,b){return b.k-a.k});
    if(!all.length)return 'Momentan niciun echipament nu are consum estimat. Adaugă puterea (W) și orele/zi din Setări ca să-ți pot da sfaturi precise.';
    var top=all.slice(0,2).map(function(x){return x.d.name.toLowerCase()+' din '+x.r.name.toLowerCase()});
    var msg='Cel mai mult consumă '+top.join(' și ')+' — '+n2(all[0].k)+' kWh/zi. ';
    msg+=S.off?'Modul OFF e deja activ, ceea ce ajută mult.':'Activează Modul OFF când pleci de acasă, ca să reduci automat consumul neesențial.';
    msg+=' Reducerea cu o oră/zi la '+all[0].d.name.toLowerCase()+' ar economisi aproximativ '+n2((all[0].d.watt||0)*(S.price||0)/1000)+' lei/zi.';
    return msg;
  }
  var pm=low.match(/(\d+(?:[.,]\d+)?)\s*%/),kw=/intensit|luminozit|dimeaz|dimmer|reglea/.test(low),lvl=null;

  else if(kw){

    if(dm)lvl=parseFloat(dm[1].replace(',','.'));
    else if(/jum[aă]tate/.test(low))lvl=0.5;
    else if(/maxim|complet/.test(low))lvl=1;
    else if(/minim/.test(low))lvl=0.1;
  }
  if(lvl!=null||kw){
    var named=[],inRoom=[];
    S.rooms.forEach(function(r){r.devices.forEach(function(d){
      if(low.indexOf(d.name.toLowerCase())>-1)named.push(d);
      else if(low.indexOf(r.name.toLowerCase())>-1)inRoom.push(d);
    })});
    var pool=named.length?named:inRoom;
    if(!pool.length)return 'Spune-mi ce bec sau ce cameră să reglez, de exemplu „setează becul din bucătărie la 50%”.';
    var ls=pool.filter(function(d){return isDim(d)});
    if(!ls.length)return 'Doar echipamentele reglabile au intensitate. '+pool[0].name+' îl pot doar porni sau opri.';
    if(lvl==null)return 'La ce intensitate? Dă-mi o valoare între 0 și 1 sau un procent, de exemplu 50%.';
    lvl=Math.round(Math.min(1,Math.max(0,lvl))*100)/100;
    ls.forEach(function(d){d.level=lvl;if(lvl>0&&!d.on)setDev(d,true);else if(lvl===0&&d.on)setDev(d,false)});
    var nm=ls.map(function(d){return d.name.toLowerCase()}).join(', ');
    return lvl===0?'Am stins '+nm+' (intensitate 0).':'Am setat intensitatea la '+n2(lvl)+' pentru '+nm+'.';
  }
  var on=/aprinde|porneste|pornește/.test(low),off=/stinge|opreste|oprește/.test(low),hit=null;
  if(on||off)S.rooms.forEach(function(r){r.devices.forEach(function(d){if(!hit&&(low.indexOf(d.name.toLowerCase())>-1||low.indexOf(r.name.toLowerCase())>-1))hit=d})});

}

async function askAI(t){

  var r=await SB.functions.invoke('ibot',{body:{message:t,history:hist,context:aiContext()}});
  if(r.error||!r.data||r.data.error||!r.data.reply){console.warn('ibot AI:',r.error||(r.data&&r.data.error));return null}
  (r.data.actions||[]).forEach(function(a){

    if(a.cancel){S.sched=S.sched.filter(function(x){return x.dev!=d.id});return}

    if(am>0&&typeof a.on==='boolean'){if(!(a.on===false&&d.essential))addSched(d,a.on,am);return}

  else r='<div class="m bot'+(m===popMsg?' pop':'')+'"'+(m===typer?' data-typing="1"':'')+'><span class="tx">'+(m===typer?'':esc(m.text))+'</span><time>'+m.time+'</time>'+(m.done||m.free?'':'<div class="q"><button class="b s" data-a="nstop" data-n="'+m.id+'">Stinge</button><button class="b o s" data-a="nkeep" data-n="'+m.id+'">Las aprinsă</button></div>')+'</div>'+(m.done?'<div class="m me">'+esc(m.done)+'</div>':'');

function chatItems(){
  var a=S.chat.length?S.chat.map(msgHtml):['<div class="mw"><div class="m bot">Nu am întrebări acum. Te anunț când un echipament stă aprins mai mult decât timpul setat.</div></div>'];

function syncThread(t){
  var items=chatItems(),norm=function(x){return x.replace(' pop"','"')},prev=t._items||[],kids=t.children;
  if(kids.length!==prev.length){t.innerHTML=items.join('');t._items=items.map(norm);return}
  for(var i=0;i<items.length;i++){
    if(i>=prev.length)t.insertAdjacentHTML('beforeend',items[i]);
    else if(prev[i]!==norm(items[i])){var tmp=document.createElement('div');tmp.innerHTML=items[i];kids[i].replaceWith(tmp.firstElementChild)}
  }
  while(t.children.length>items.length)t.lastElementChild.remove();
  t._items=items.map(norm);
}

    var tgl='<div class="seg" role="group" aria-label="Mod afișare"><button class="'+(cv==='graf'?'on':'')+'" data-a="cv" data-c="graf" aria-pressed="'+(cv==='graf')+'">Grafic</button><button class="'+(cv==='tab'?'on':'')+'" data-a="cv" data-c="tab" aria-pressed="'+(cv==='tab')+'">Tabel</button></div>';
    h+='<div class="box" style="margin-top:16px"><div class="ln" style="margin-bottom:14px;flex-wrap:wrap;gap:10px"><h2 style="margin:0">Consum de electricitate estimat</h2><label class="priceLbl">Preț/kWh<input type="number" min="0" step="0.01" id="price" value="'+(S.price||0)+'" class="priceIn" aria-label="Preț per kWh"><span>lei</span></label></div>'+
    tgl+(cv==='tab'?tblHtml:grHtml)+
    '<button class="b" data-a="askibot" style="margin-top:16px">Întreabă ibot cum să economisești</button></div>';
  }else if(view==='rooms'){

      return '<div class="sec">'+esc(r.name)+'<small>Apasă pe un card ca să-l pornești sau să-l oprești</small></div><div class="tiles">'+(r.devices.length?r.devices.map(function(d){
        return '<div class="cell'+(isDim(d)?' lt':'')+'"><button class="tile'+(d.on?' on':'')+'" data-a="tg" data-d="'+d.id+'" aria-pressed="'+d.on+'" aria-label="'+esc(d.name)+(d.on?', aprins':', stins')+'"><div class="top"><b>'+esc(d.name)+'</b>'+(d.heart?'<span class="hrt" title="Protejat: nu se oprește automat cât rulează" role="img" aria-label="Protejat">'+HEART+'</span>':'')+'</div><small>'+tn(d)+(d.essential?' esențială':'')+'</small></button>'+(isDim(d)?'<button class="bb" data-a="dim" data-d="'+d.id+'" aria-label="Intensitate '+esc(d.name)+'" title="Intensitate">'+BULB+'</button>':'')+'</div>'}).join(''):'<p style="color:var(--mut)">Camera nu are echipamente. Adaugă-le din Setări.</p>')+'</div>'}).join('')||'<p>Nu ai nicio cameră. Adaug-o din Setări.</p>';

      return '<div class="set"><h3><input type="text" value="'+esc(r.name)+'" data-k="rn" data-r="'+r.id+'" aria-label="Numele camerei"><button class="b r s" data-a="dr" data-r="'+r.id+'">Șterge camera</button></h3>'+
      r.devices.map(function(d){return '<div class="dr"><div><input type="text" value="'+esc(d.name)+'" data-k="dn" data-d="'+d.id+'" aria-label="Nume echipament"><small>'+tn(d)+'</small></div><div><input type="number" min="0" value="'+(d.watt||0)+'" data-k="wt" data-d="'+d.id+'" aria-label="Putere în wați"><small>W</small></div><div><input type="number" min="0" step="0.1" value="'+(d.hours!=null?d.hours:0)+'" data-k="hr" data-d="'+d.id+'" aria-label="Ore de utilizare pe zi"><small>ore/zi</small></div><div><input type="number" min="0" value="'+d.check+'" data-k="ck" data-d="'+d.id+'" aria-label="Minute pentru check"><small>minute check</small></div><label><input type="checkbox" data-k="es" data-d="'+d.id+'"'+(d.essential?' checked':'')+'>Esențial</label><button type=\"button\" class=\"hbtn\" data-a=\"ht\" data-d=\"'+d.id+'\" aria-pressed=\"'+(d.heart?'true':'false')+'\" title=\"Nu se oprește automat la Modul OFF cât timp rulează. ibot te întreabă și îl oprește singur când se termină programul (ex: mașina de spălat)\">'+HEART+'Protejat</button><button class="b r s" data-a="dd" data-d="'+d.id+'">Șterge</button></div>'}).join('')+

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a],[data-v]');if(!b)return;
  if(b.dataset.a==='none')return;
  if(b.dataset.v){dimId=null;view=b.dataset.v;if(view==='ibot')userSentFlag=true;render();return}
  var a=b.dataset.a,d=b.dataset.d?find(b.dataset.d):null,r=S.rooms.filter(function(x){return x.id==b.dataset.r})[0],m=S.chat.filter(function(x){return x.id==b.dataset.n})[0];
  if(a==='in')setCount(S.count+1);
  else if(a==='exit')setCount(S.count-1);
  else if(a==='off'){if(S.off){S.off=false;S.rooms.forEach(function(rr){rr.devices.forEach(function(dd){dd.heartAsked=false})});sys('Modul OFF dezactivat manual.')}else offOn()}
  else if(a==='cv')S.cview=b.dataset.c==='tab'?'tab':'graf';
  else if(a==='dim'){dimId=d.id;focusDim=true}
  else if(a==='dimx'){if(e.target.closest('.sheet')&&!e.target.closest('button')){return}dimId=null}
  else if(a==='tg')setDev(d,!d.on);
  else if(a==='ht'){d.heart=!d.heart;if(!d.heart){d.heartAsked=false;d.heartUntil=null}}
  else if(a==='nstop'&&m){setDev(find(m.dev),false);m.done='Stinge';userSentFlag=true}
  else if(a==='nkeep'&&m){var x=find(m.dev);x.since=Date.now();x.asked=false;m.done='Las aprinsă';userSentFlag=true}
  else if(a==='hset'&&m){var inp=document.getElementById('hmin'+m.id);var mins=inp?Math.max(1,Math.round(+inp.value||0)):0;if(!mins){if(inp)inp.focus();return}var dv=find(m.dev);dv.heartUntil=Date.now()+mins*60000;m.done='Program setat: '+mins+' min';userSentFlag=true}
  else if(a==='hstop'&&m){setDev(find(m.dev),false);m.done='Oprire imediată';userSentFlag=true}
  else if(a==='dr'){if(confirm('Ștergi camera „'+r.name+'” și tot ce conține?'))S.rooms=S.rooms.filter(function(y){return y!==r})}
  else if(a==='dd')S.rooms.forEach(function(y){y.devices=y.devices.filter(function(z){return z!==d})});
  else if(a==='ad'){var i=b.parentNode.querySelector('input');if(!i.value.trim()){i.focus();return}var tc=b.parentNode.querySelector('select').value,tt=S.types.filter(function(x){return x.code===tc})[0]||{};r.devices.push({id:++uid,name:i.value.trim(),type:tc,on:false,check:0,level:1,watt:tt.default_watt||0,hours:tt.default_hours||0})}
  else if(a==='ar'){var n=$('#nr');if(!n.value.trim()){n.focus();return}S.rooms.push({id:++uid,name:n.value.trim(),devices:[]})}
  else if(a==='at'){var ni=$('#ntn'),nm=ni.value.trim();if(!nm){ni.focus();return}var cd=nm.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'tip';if(S.types.some(function(x){return x.code===cd})){alert('Există deja un tip cu acest nume.');return}S.types.push({id:++uid,code:cd,name:nm,dimmable:false,default_watt:50,default_hours:2})}
  else if(a==='dt'){var tt2=S.types.filter(function(x){return x.id==b.dataset.t})[0];if(tt2&&S.rooms.some(function(rr){return rr.devices.some(function(dd){return dd.type===tt2.code})}))alert('Tipul este folosit de unele echipamente.');else S.types=S.types.filter(function(y){return y!==tt2})}
  else if(a==='mic'){startMic()}
  else if(a==='send'){var i=$('#ibotIn');sendFree(i.value);i.value='';userSentFlag=true}
  else if(a==='askibot'){view='ibot';sendFree('Cum pot să economisesc curent electric?');userSentFlag=true}
  else if(a==='totop'){toBottom(true);return}
  render();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='price'){S.price=Math.max(0,+t.value||0);render();return}
  var k=t.dataset.k;if(!k)return;
  if(t.dataset.t){var tt=S.types.filter(function(x){return x.id==t.dataset.t})[0];if(tt){if(k==='tn'&&t.value.trim())tt.name=t.value.trim();if(k==='td')tt.dimmable=t.checked;if(k==='tw')tt.default_watt=Math.max(0,+t.value||0);if(k==='th')tt.default_hours=Math.max(0,+t.value||0)}save();render();return}
  if(k==='rn'){var r=S.rooms.filter(function(x){return x.id==t.dataset.r})[0];if(t.value.trim())r.name=t.value.trim()}
  else{var d=find(t.dataset.d);
    if(k==='dn'&&t.value.trim())d.name=t.value.trim();
    if(k==='wt')d.watt=Math.max(0,+t.value||0);
    if(k==='hr')d.hours=Math.max(0,+t.value||0);
    if(k==='ck'){d.check=Math.max(0,Math.round(+t.value||0));d.asked=false;if(d.on)d.since=Date.now()}
    if(k==='es')d.essential=t.checked}
  save();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(!t.dataset||t.dataset.k!=='lv')return;
  var d=find(t.dataset.d);if(!d)return;
  var v=Math.min(1,Math.max(0,+t.value||0));

  var o=document.getElementById('lo'+d.id);if(o)o.textContent=n2(v);

document.addEventListener('keydown',function(e){

document.addEventListener('scroll',function(e){

var vv=window.visualViewport;

if(vv){vv.addEventListener('resize',vp);vv.addEventListener('scroll',vp)}
window.addEventListener('resize',vp);vp();

document.addEventListener('focusout',function(e){if(e.target&&e.target.id==='ibotIn'){document.body.classList.remove('kb');setTimeout(vp,100)}});

function show(v){$('#login').classList.toggle('hide',v);$('#app').classList.toggle('hide',!v);if(v)render()}
async function enter(){
  try{await load()}catch(x){await SB.auth.signOut();$('#lerr').textContent=x.message||'Eroare la încărcare.';show(false);return}
  ready=true;show(true);subscribe();
}
$('#lf').onsubmit=async function(e){e.preventDefault();$('#lerr').textContent='';var r=await SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error){$('#lerr').textContent='Email sau parolă greșite.';return}enter()};
$('#out').onclick=async function(){ready=false;if(rt)SB.removeChannel(rt);await SB.auth.signOut();show(false)};
SB.auth.getSession().then(function(r){if(r.data&&r.data.session)enter()});

setInterval(function(){
  var ch=false,now=Date.now();
  S.rooms.forEach(function(r){r.devices.forEach(function(d){
    if(d.on&&d.heartUntil&&now>=d.heartUntil){setDev(d,false);sys(d.name+': programul s-a terminat, priza a fost oprită.');ch=true}
    if(d.on&&d.check>0&&!d.asked&&d.since&&(now-d.since)/1000*SCALE/60>=d.check){
      d.asked=true;S.chat.push({id:++uid,dev:d.id,text:'Mai folosești '+d.name.toLowerCase()+'? Nu a mai fost stinsă de '+d.check+' minute.',time:tm(),done:null});ch=true}
  })});
  if(S.sched.length){var due=S.sched.filter(function(x){return x.at<=now});
    if(due.length){S.sched=S.sched.filter(function(x){return x.at>now});due.forEach(function(x){var d=find(x.dev);if(!d)return;if(!x.on&&d.essential)return;setDev(d,x.on);sys('Programare executată: am '+(x.on?'pornit ':'oprit ')+d.name.toLowerCase()+'.')});ch=true}}
  if(ch&&!$('#app').classList.contains('hide')&&view!=='set')render();else if(ch)save();
},1000);
})();
