<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ihouse – Aplicație</title>
<link rel="icon" href="pagelogo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#189947;--gd:#0c5a29;--ink:#17201b;--mut:#56645b;--paper:#f3f7f4;--lamp:#ffe58a;--line:#d9e3dc;--red:#c4302b}
*{box-sizing:border-box;margin:0}
body{font-family:Sora,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:var(--paper);line-height:1.55}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hide{display:none!important}
.b{border:0;background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:10px 20px;border-radius:40px;cursor:pointer}
.b:hover{background:var(--g)}
.b.o{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.b.o:hover{background:var(--ink);color:#fff}
.b.s{padding:6px 14px;font-size:13px}
.b.r{background:#fff;color:var(--red);border:2px solid var(--red)}
.b.r:hover{background:var(--red);color:#fff}
.b:disabled{opacity:.45;cursor:not-allowed}
.b:disabled:hover{background:var(--ink)}
.b.o:disabled:hover{background:#fff;color:var(--ink)}
input[type=text],input[type=email],input[type=password],input[type=number]{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;width:100%}
input:focus,select:focus{border-color:var(--g);outline:none}
#login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
#login .pane{background:linear-gradient(180deg,rgba(12,90,41,.35),rgba(12,90,41,.92)),url('https://images.unsplash.com/photo-1755311904955-db548ff83672?fm=jpg&q=70&w=1200&auto=format&fit=crop') center/cover no-repeat;color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:flex-end}
#login .pane h1{font-size:clamp(34px,4.4vw,58px);line-height:1.02;letter-spacing:-.045em;font-weight:800}
#login .pane p{margin-top:16px;color:#eaf8ee;max-width:24em}
#login form{background:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;max-width:460px;width:100%;margin:auto}
#login form img{height:32px;align-self:flex-start;margin-bottom:32px}
#login h2{font-size:24px;letter-spacing:-.03em;margin-bottom:20px}
#login label{font-weight:600;font-size:14px;margin:12px 0 6px}
#login form .b{margin-top:24px;padding:14px}
#login small{margin-top:14px;color:var(--mut);font-size:13px}
#app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
aside{background:#fff;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
aside img{height:28px;align-self:flex-start;margin:0 8px 26px;flex-shrink:0}
aside button.nv{text-align:left;background:none;border:0;padding:12px 14px;border-radius:12px;cursor:pointer;font-weight:600;color:var(--mut);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
aside button.nv:hover{background:var(--paper)}
aside button.nv.on{background:var(--g);color:#fff}
.badge{background:var(--red);color:#fff;border-radius:20px;font-size:12px;padding:0 8px;line-height:20px}
.dot{width:9px;height:9px;border-radius:50%;background:#e2a400;box-shadow:0 0 0 2px #fff;flex:none}
aside .bt{margin-top:auto;display:grid;gap:6px;flex-shrink:0;padding-top:14px}
aside .bt a{font-size:13px;color:var(--mut);padding:0 14px;text-decoration:none}
main{padding:36px 40px 80px;max-width:900px;width:100%}
main h1{font-size:28px;letter-spacing:-.035em;font-weight:800;margin-bottom:22px}
.hero{border-radius:24px;padding:32px;background:var(--g);color:#fff;display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.hero.z{background:var(--gd)}
.hero .num{font-size:clamp(48px,13vw,88px);font-weight:800;letter-spacing:-.05em;line-height:1;flex-shrink:0}
.hero .t{flex:1;min-width:200px}
.hero .t b{display:block;font-size:20px}
.hero .t span{font-size:14px;color:#dff3e5}
.hero .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero .b{background:#fff;color:var(--ink)}
.hero .b:hover{background:var(--lamp)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.box{background:#fff;border-radius:20px;padding:22px;border:1px solid var(--line)}
.box h2{font-size:16px;margin-bottom:10px}
.box p,.box li{font-size:14px;color:var(--mut)}
.box ul{padding-left:18px}
.sw{position:relative;width:52px;height:30px;border-radius:15px;border:0;background:#c3cec7;cursor:pointer;flex:none;transition:background .15s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true]{background:var(--g)}
.sw[aria-checked=true]:after{transform:translateX(22px)}
.ln{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.sec{margin:26px 0 12px;font-size:18px;font-weight:600;display:flex;align-items:baseline;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{border:2px solid var(--line);background:#fff;border-radius:18px;padding:16px;text-align:left;min-height:110px;width:100%;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:background .2s,border-color .2s,color .2s}
.tile.on{background:var(--g);border-color:var(--g);color:#fff}
.tile:hover{border-color:var(--g)}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;min-width:0}
.tile b{font-size:15px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.tile small{color:var(--mut);font-size:12px;overflow-wrap:anywhere}
.tile.on small{color:#e2f7e8}
.tile .hrt{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;flex:none;color:#e5322d}.tile .hrt svg{width:18px;height:18px;display:block;fill:#e5322d}.tile.on .hrt{color:#fff}
.cell{display:flex;flex-direction:column;gap:8px;position:relative;min-width:0}
.cell .tile{flex:1}
.cell.lt .tile .top{padding-right:40px}
.bb{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:1;padding:0}
.bb:hover{border-color:var(--g);color:var(--g)}
.ov{position:fixed;inset:0;background:rgba(23,32,27,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:#fff;border-radius:24px;padding:22px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.sheet h2{font-size:20px;letter-spacing:-.03em}
.sheet .hd small{display:block;color:var(--mut);font-size:13px}
.sheet .x{border:0;background:var(--paper);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;flex:none}
.sheet .x:hover{background:var(--line)}
.sheet .big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1;text-align:center;margin:6px 0 14px}
.sheet input[type=range]{width:100%;margin:0;accent-color:var(--g);cursor:pointer;height:28px}
.sheet .sc{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:2px}
.sheet .b{width:100%;margin-top:18px;padding:12px}
.sheet.cf{max-width:420px}
.sheet.cf .hd{margin-bottom:8px}
.sheet .cfx{color:var(--mut);font-size:15px}
.sheet .cfb{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.sheet .cfb .b{flex:1 1 140px;width:auto;margin:0}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:40px;padding:3px;margin-bottom:16px}
.seg button{border:0;background:none;border-radius:40px;padding:7px 18px;font-weight:600;font-size:13px;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--g);color:#fff}
.gr{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr);gap:24px;align-items:center;margin-bottom:22px}
.donut{width:100%;max-width:210px;height:auto;display:block;margin:0 auto}
.donut text{font-family:inherit;text-anchor:middle}
.lg{display:grid;gap:8px;font-size:13px}
.lg div{display:flex;align-items:center;gap:8px;min-width:0}
.lg i{width:12px;height:12px;border-radius:4px;flex:none}
.lg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}
.lg b{white-space:nowrap}
.sub{font-size:13px;font-weight:600;color:var(--mut);margin:0 0 10px}
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
img{max-width:100%}
.two>*,.tiles>*,.gr>*{min-width:0}
.thread{display:grid;gap:12px;max-width:560px}
.m{padding:12px 16px;border-radius:18px;font-size:15px;max-width:90%}
.m.bot{background:#fff;border:1px solid var(--line);border-top-left-radius:4px}
.m.me{background:var(--g);color:#fff;justify-self:end;border-top-right-radius:4px}
.m.sys{justify-self:center;background:none;color:var(--mut);font-size:13px;text-align:center}
.m time{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.m .q{display:flex;gap:8px;margin-top:10px}
.set{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px}
.set h3{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:16px}
.hbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--mut);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s,background .15s}
.hbtn svg{width:16px;height:16px;fill:none;transition:fill .15s}
.hbtn:hover{border-color:#e5322d;color:#e5322d}
.hbtn[aria-pressed=true]{border-color:#e5322d;color:#e5322d;background:#fff1f0}
.hbtn[aria-pressed=true] svg{fill:#e5322d}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;min-width:0}
.add select{border:2px solid var(--line);border-radius:12px;padding:0 10px;font:inherit;background:#fff}
.chart{display:grid;gap:10px;margin-bottom:20px}
.cb-row{display:grid;grid-template-columns:110px 1fr 74px;gap:10px;align-items:center;font-size:13px}
.cb-label{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-track{background:var(--paper);border:1px solid var(--line);border-radius:10px;height:16px;overflow:hidden}
.cb-fill{background:var(--g);height:100%;border-radius:10px;transition:width .3s}
.cb-val{text-align:right;font-weight:600;white-space:nowrap}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.priceIn{width:64px;border:2px solid var(--line);border-radius:10px;padding:4px 8px;font:inherit;background:#fff;margin-left:6px}

/* ---------- Editor Setări ---------- */
#setEd .lead{font-size:14px;color:var(--mut);margin:-10px 0 18px}
#setEd select{border:2px solid var(--line);border-radius:12px;padding:9px 10px;background:#fff;width:100%;min-width:0;height:46px}
#setEd input[type=text],#setEd input[type=number]{height:46px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:var(--mut)}
.fld.grow{flex:1}
.rh{display:flex;gap:10px;align-items:flex-end;margin-bottom:6px}
.rh .b{height:46px;flex:none}
.dev{border-top:1px solid var(--line);padding:14px 0;display:grid;gap:10px}
.dev .r1{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) auto;gap:10px;align-items:end}
.dev .r1 .b{height:46px}
.dev .r2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto auto;gap:10px;align-items:end}
.chk{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:2px solid var(--line);border-radius:12px;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap;background:#fff}
.chk input{width:18px;height:18px;accent-color:var(--g);margin:0}
.trow{border-top:1px solid var(--line);padding:14px 0;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto auto;gap:10px;align-items:end}
.trow .b{height:46px}
.fld small{font-size:11px;color:var(--mut)}
.empty{font-size:14px;color:var(--mut);padding:10px 0;border-top:1px solid var(--line)}
#setEd .add{margin-top:14px}
#setEd .add input,#setEd .add select,#setEd .add .b{height:46px}
.bad{border-color:var(--red)!important;background:#fff5f4!important}
.savebar{position:sticky;bottom:16px;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 8px 24px rgba(23,32,27,.12);margin-top:16px}
.savebar.dirty{border-color:var(--g);box-shadow:0 0 0 3px rgba(24,153,71,.15),0 8px 24px rgba(23,32,27,.12)}
.savebar #sbTxt{font-size:14px;color:var(--mut);font-weight:600;flex:1;min-width:180px}
.savebar.dirty #sbTxt{color:var(--gd)}
.savebar.err #sbTxt{color:var(--red)}
.savebar .acts{display:flex;gap:8px}
.savebar .acts .b{padding:10px 18px}

/* ---------- ibot ---------- */
.ibotWrap{position:relative;display:flex;flex-direction:column;max-width:560px;height:calc(100vh - 120px);height:calc(100dvh - 120px)}
.ibotWrap h1{margin-bottom:12px;flex-shrink:0}
.chatBody{position:relative;flex:1;min-height:0;display:flex}
.ibot-thread{flex:1;width:100%;overflow-y:auto;align-content:start;padding:0 4px 12px 0;overscroll-behavior:contain}
.ibot-bar{flex-shrink:0;padding:10px 0 0;max-width:100%;align-items:center}
.ibot-bar .b{white-space:nowrap;height:44px}
.mic{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:118px}
.mic svg{width:16px;height:16px;flex:none}
.mic[data-st=starting]{background:var(--mut)}
.mic[data-st=listening]{background:var(--red)}
.mic[data-st=listening]:hover{background:#a52722}
.mic[data-st=processing]{background:var(--gd);opacity:.8;cursor:progress}
.mic[data-st=error]{background:#fff;color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.mic[data-st=error]:hover{background:var(--red);color:#fff}
.micmsg{flex-shrink:0;font-size:13px;color:var(--mut);margin-top:8px;line-height:1.4}
.scrollTop{position:absolute;right:10px;bottom:10px;width:46px;height:46px;border-radius:50%;background:var(--ink);color:#fff;border:0;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:4}
.scrollTop.show{opacity:1;pointer-events:auto}
.scrollTop:hover{background:var(--g)}

#sy{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--red);color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;z-index:50;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#sy.ok{background:var(--g)}

@media(max-width:800px){.ov{align-items:flex-end;padding:0}.sheet{max-width:none!important;border-radius:24px 24px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom, 0px))}}
@media(max-width:800px){
#login{grid-template-columns:1fr}#login .pane{display:none}#login form{padding:32px 24px}
#app{grid-template-columns:minmax(0,1fr)}
aside{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom, 0px));left:12px;right:12px;top:auto;height:auto;flex-direction:row;padding:6px;z-index:5;border:1px solid var(--line);border-radius:20px;box-shadow:0 6px 18px rgba(23,32,27,.12)}
aside img,aside .bt{display:none}
aside button.nv{flex:1;justify-content:center;padding:10px 4px;font-size:13px;gap:6px}
main{width:100%;max-width:100%;padding:20px 14px calc(120px + env(safe-area-inset-bottom, 0px))}main h1{font-size:24px}
.two,.gr{grid-template-columns:minmax(0,1fr)}.hero{padding:22px;gap:16px}.box{padding:16px}.set{padding:14px}
input[type=text],input[type=email],input[type=password],input[type=number],select{font-size:16px}
.thread{max-width:100%}.m{max-width:100%}.m .q{flex-wrap:wrap}
.cb-row{grid-template-columns:minmax(70px,90px) minmax(0,1fr) auto}
#sy{top:calc(12px + env(safe-area-inset-top, 0px));bottom:auto}

/* Camere: exact 3 carduri pe rând */
.sec{margin:20px 0 10px;font-size:16px}
.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{padding:10px 9px;min-height:92px;border-radius:14px}
.tile .top{gap:4px}
.tile b{font-size:13px;line-height:1.2;word-break:break-word;hyphens:auto}
.tile small{font-size:11px;line-height:1.25;margin-top:6px}
.tile .hrt{width:16px;height:16px}.tile .hrt svg{width:15px;height:15px}
.cell.lt .tile .top{padding-right:0}
.cell.lt .tile{padding-bottom:50px}
.bb{top:auto;bottom:8px;right:8px;width:36px;height:36px}

/* Setări pe mobil */
.rh{flex-wrap:wrap}.rh .fld{flex:1 1 100%}.rh .b{width:100%}
.dev .r1{grid-template-columns:minmax(0,1fr) auto}
.dev .r1 .fld:first-child{grid-column:1 / -1}
.dev .r2{grid-template-columns:repeat(2,minmax(0,1fr))}
.trow{grid-template-columns:repeat(2,minmax(0,1fr))}
.trow .fld:first-child{grid-column:1 / -1}
#setEd .add{flex-wrap:wrap}#setEd .add input{flex:1 1 100%}#setEd .add select{flex:1}
.savebar{bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
.savebar .acts{width:100%}.savebar .acts .b{flex:1}
body.ekb aside{display:none}
body.ekb .savebar{bottom:8px}

/* ibot pe mobil */
.ibotWrap{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh);max-width:none;z-index:4;background:transparent;padding:14px 14px calc(84px + env(safe-area-inset-bottom,0px))}
body.kb .ibotWrap{padding-bottom:10px}
body.kb aside{display:none}
.scrollTop{right:6px;bottom:6px}
}
@media(max-width:440px){
.ibot-bar{flex-wrap:wrap}
.ibot-bar input{flex:1 1 100%}
.ibot-bar .b{flex:1}
}
@media(max-width:360px){
main{padding-left:10px;padding-right:10px}
.tiles{gap:6px}
.tile{padding:9px 7px}
.tile b{font-size:12.5px}
.tile small{font-size:10.5px}
}
html,body{max-width:100%}
main,.box,.hero,.set{min-width:0}
main{overflow-wrap:anywhere}

.priceLbl{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}
input.priceIn[type=number]{width:78px;margin:0;padding:6px 10px;border-radius:10px;font:inherit;color:var(--ink);text-align:right}
.thread{gap:10px}
.m{font-size:15px;line-height:1.55;max-width:86%;padding:12px 16px;border-radius:20px}
.m.bot{border:0;border-top-left-radius:6px;box-shadow:0 1px 2px rgba(23,32,27,.06),0 8px 22px rgba(23,32,27,.06)}
.m.me{background:linear-gradient(135deg,#21b055,#14873d);border-top-right-radius:6px;box-shadow:0 6px 16px rgba(24,153,71,.28)}
.m time{font-size:10.5px;opacity:.75;margin-top:5px}
.m.me time{color:rgba(255,255,255,.8)}
.pop{animation:pop .34s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.m.typing{display:flex;gap:6px;align-items:center;justify-self:start;width:fit-content;padding:15px 18px}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--g);animation:wave 1.1s ease-in-out infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes wave{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-7px);opacity:1}}

async function push(){
  timer=null;if(!ready)return false;
  if(busy){dirty=true;return}
  busy=true;var remap=false,ok=false;
  try{
    var seen={},idm={};
    var up=async function(tab,key,o,row){
      var j=JSON.stringify(row);
      if(o.id>=BIG){var old=o.id,x=await SB.from(tab).insert(row).select('id').single();if(x.error)throw x.error;o.id=x.data.id;idm[old]=o.id;remap=true}
      else if(snap[key+o.id]!==j){var y=await SB.from(tab).update(row).eq('id',o.id);if(y.error)throw y.error}
      snap[key+o.id]=j;seen[key+o.id]=1;
    };
    for(var a=0;a<S.types.length;a++)await up('device_types','t',S.types[a],tRow(S.types[a]));
    for(var i=0;i<S.rooms.length;i++){var r=S.rooms[i];await up('rooms','r',r,rRow(r,i));for(var k=0;k<r.devices.length;k++)await up('devices','d',r.devices[k],dRow(r.devices[k],r))}
    S.chat.forEach(function(m){if(idm[m.dev])m.dev=idm[m.dev]});
    for(var c=0;c<S.chat.length;c++)await up('ibot_messages','m',S.chat[c],mRow(S.chat[c]));
    S.sched.forEach(function(x){if(idm[x.dev])x.dev=idm[x.dev]});
    try{for(var q2=0;q2<S.sched.length;q2++)await up('schedules','s',S.sched[q2],scRow(S.sched[q2]))}catch(x2){console.warn('schedules:',x2.message||x2);S.sched.forEach(function(x){seen['s'+x.id]=1})}
    var tabs={t:'device_types',r:'rooms',d:'devices',m:'ibot_messages',s:'schedules'};
    for(var key in snap){if(!seen[key]){var z=await SB.from(tabs[key[0]]).delete().eq('id',key.slice(1));if(z.error)throw z.error;delete snap[key]}}
    var sj=JSON.stringify(sRow());
    if(sj!==sSnap){var u=await SB.from('settings').update(sRow()).eq('id',1);if(u.error)throw u.error;sSnap=sj}
    clearErr();ok=true;
  }catch(x){note('Nu s-a salvat: '+(x.message||x))}

function ibotReply(t){
  var low=t.toLowerCase();
  var tmm=low.match(/peste\s+(\d+(?:[.,]\d+)?)\s*(?:de\s+)?(ore|ora|oră|h|min\w*)/);
  if(tmm&&/stinge|opre[sș]te|aprinde|porne[sș]te/.test(low)){
    var mins=parseFloat(tmm[1].replace(',','.'))*(/^(ore|ora|oră|h)$/.test(tmm[2])?60:1),son=/aprinde|porne[sș]te/.test(low),shit=[];
    S.rooms.forEach(function(r){r.devices.forEach(function(d){if(low.indexOf(d.name.toLowerCase())>-1)shit.push(d)})});
    if(!shit.length)S.rooms.forEach(function(r){if(low.indexOf(r.name.toLowerCase())>-1)r.devices.forEach(function(d){shit.push(d)})});
    if(!shit.length)return 'Spune-mi ce echipament să programez, de exemplu „stinge lumina din bucătărie peste 20 de minute”.';
    shit=shit.filter(function(d){return son||!d.essential});
    if(!shit.length)return 'Echipamentele esențiale, precum frigiderul, nu se opresc.';
    shit.forEach(function(d){addSched(d,son,mins)});
    return 'Gata, voi '+(son?'porni ':'stinge ')+shit.map(function(d){return d.name.toLowerCase()}).join(', ')+' peste '+(mins>=120?n2(mins/60)+' ore':Math.round(mins)+' minute')+'.';
  }
  if(/economis|salv[ae]|reduce.*consum|factur/.test(low)){
    var all=[];S.rooms.forEach(function(r){r.devices.forEach(function(d){if(kwh(d)>0&&!d.essential&&!d.heart)all.push({d:d,r:r,k:kwh(d)})})});
    all.sort(function(a,b){return b.k-a.k});
    if(!all.length)return 'Momentan niciun echipament nu are consum estimat. Adaugă puterea (W) și orele/zi din Setări ca să-ți pot da sfaturi precise.';
    var top=all.slice(0,2).map(function(x){return x.d.name.toLowerCase()+' din '+x.r.name.toLowerCase()});
    var msg='Cel mai mult consumă '+top.join(' și ')+' — '+n2(all[0].k)+' kWh/zi. ';
    msg+=S.off?'Modul OFF e deja activ, ceea ce ajută mult.':'Activează Modul OFF când pleci de acasă, ca să reduci automat consumul neesențial.';
    msg+=' Reducerea cu o oră/zi la '+all[0].d.name.toLowerCase()+' ar economisi aproximativ '+n2((all[0].d.watt||0)*(S.price||0)/1000)+' lei/zi.';
    return msg;
  }
  var pm=low.match(/(\d+(?:[.,]\d+)?)\s*%/),kw=/intensit|luminozit|dimeaz|dimmer|reglea/.test(low),lvl=null;
  if(pm)lvl=parseFloat(pm[1].replace(',','.'))/100;
  else if(kw){
    var dm=low.match(/(?:^|[^\d.,])(0[.,]\d+|1(?:[.,]0+)?|0)(?![\d])/);
    if(dm)lvl=parseFloat(dm[1].replace(',','.'));
    else if(/jum[aă]tate/.test(low))lvl=0.5;
    else if(/maxim|complet/.test(low))lvl=1;
    else if(/minim/.test(low))lvl=0.1;
  }
  if(lvl!=null||kw){
    var named=[],inRoom=[];
    S.rooms.forEach(function(r){r.devices.forEach(function(d){
      if(low.indexOf(d.name.toLowerCase())>-1)named.push(d);
      else if(low.indexOf(r.name.toLowerCase())>-1)inRoom.push(d);
    })});
    var pool=named.length?named:inRoom;
    if(!pool.length)return 'Spune-mi ce bec sau ce cameră să reglez, de exemplu „setează becul din bucătărie la 50%”.';
    var ls=pool.filter(function(d){return isDim(d)});
    if(!ls.length)return 'Doar echipamentele reglabile au intensitate. '+pool[0].name+' îl pot doar porni sau opri.';
    if(lvl==null)return 'La ce intensitate? Dă-mi o valoare între 0 și 1 sau un procent, de exemplu 50%.';
    lvl=Math.round(Math.min(1,Math.max(0,lvl))*100)/100;
    ls.forEach(function(d){d.level=lvl;if(lvl>0&&!d.on)setDev(d,true);else if(lvl===0&&d.on)setDev(d,false)});
    var nm=ls.map(function(d){return d.name.toLowerCase()}).join(', ');
    return lvl===0?'Am stins '+nm+' (intensitate 0).':'Am setat intensitatea la '+n2(lvl)+' pentru '+nm+'.';
  }
  var on=/aprinde|porneste|pornește/.test(low),off=/stinge|opreste|oprește/.test(low),hit=null;
  if(on||off)S.rooms.forEach(function(r){r.devices.forEach(function(d){if(!hit&&(low.indexOf(d.name.toLowerCase())>-1||low.indexOf(r.name.toLowerCase())>-1))hit=d})});
  if(hit){setDev(hit,on);return (on?'Am pornit ':'Am oprit ')+hit.name.toLowerCase()+'.'}
  return 'Am notat mesajul tău. Îmi poți spune „aprinde” sau „stinge” urmat de numele unui echipament sau al unei camere, să reglez intensitatea unui bec (de exemplu „becul din bucătărie la 50%”), sau întreabă-mă cum să economisești curent.';
}

var MIC_ARIA={idle:'Vorbește cu ibot',starting:'Se conectează microfonul. Apasă pentru a anula',listening:'Ascult. Apasă pentru a opri',processing:'Se procesează mesajul',error:'Încearcă din nou să vorbești cu ibot'};
var PERM_MSG='Accesul la microfon este blocat pentru acest site. Apasă pe iconița din stânga adresei (lacăt / „aA” pe iPhone), permite Microfonul, apoi apasă din nou „Vorbește”.';
var micPerm='unknown';
try{if(navigator.permissions&&navigator.permissions.query){navigator.permissions.query({name:'microphone'}).then(function(p){micPerm=p.state;p.onchange=function(){micPerm=p.state;if(p.state!=='denied'&&V.st==='error'&&V.msg===PERM_MSG)vSet('idle')}}).catch(function(){})}}catch(x){}
function micBtnHtml(){return '<button type="button" class="b s mic" id="micBtn" data-a="mic" data-st="'+V.st+'" aria-pressed="'+(V.st==='listening')+'" aria-label="'+MIC_ARIA[V.st]+'"'+(V.st==='processing'?' disabled':'')+'>'+MICI+'<span class="ml">'+MIC_TXT[V.st]+'</span></button>'}
function updMic(){
  var b=$('#micBtn');
  if(b){b.dataset.st=V.st;b.querySelector('.ml').textContent=MIC_TXT[V.st];b.setAttribute('aria-pressed',V.st==='listening');b.setAttribute('aria-label',MIC_ARIA[V.st]);b.disabled=V.st==='processing'}
  var m=$('#micMsg');if(m){m.textContent=V.msg;m.classList.toggle('hide',!V.msg)}
}
function vSet(st,msg){V.st=st;V.msg=msg||'';updMic()}
function vClear(){clearTimeout(V.t1);clearTimeout(V.t2);clearTimeout(V.t3);V.t1=V.t2=V.t3=null}
function vDetach(){var r=V.rec;V.rec=null;if(r){r.onstart=r.onaudiostart=r.onresult=r.onerror=r.onend=null;try{r.abort()}catch(x){}}}
function vErrMsg(e){
  return ({
    'not-allowed':PERM_MSG,
    'service-not-allowed':'Browserul nu permite recunoașterea vocală aici. Verifică dacă pagina e deschisă prin https; pe iPhone trebuie activate Siri și Dictarea din Setări.',
    'audio-capture':'Nu găsesc niciun microfon sau este folosit de altă aplicație. Închide aplicația respectivă și încearcă din nou.',
    'network':'Recunoașterea vocală are nevoie de internet (serviciul browserului). Verifică conexiunea și încearcă din nou.',
    'language-not-supported':'Browserul nu recunoaște limba română. Încearcă în Chrome sau Edge.',
    'aborted':'Ascultarea a fost întreruptă. Apasă din nou „Vorbește”.',
    'start-timeout':'Microfonul nu a pornit. Apasă din nou „Vorbește”.',
    'start-failed':'Microfonul nu a putut porni. Apasă din nou „Vorbește”.'
  })[e]||'A apărut o problemă cu microfonul. Apasă din nou „Vorbește”.';
}
function micClick(){
  if(V.st==='processing')return;
  if(V.st==='starting'){vCancel();return}
  if(V.st==='listening'){vStopManual();return}
  vStart();
}
function vStart(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){vSet('error','Acest browser nu are recunoaștere vocală. Folosește Chrome sau Edge (laptop/Android) ori Safari (iPhone). Poți scrie mesajul în câmpul de text.');return}
  if(window.isSecureContext===false){vSet('error','Microfonul funcționează doar dacă pagina este deschisă prin https.');return}
  if(micPerm==='denied'){vSet('error',PERM_MSG);return}
  vClear();vDetach();
  var my=++V.sess,r;
  try{r=new SR()}catch(x){vSet('error',vErrMsg('start-failed'));return}
  V.rec=r;V.manual=false;V.text='';V.err=null;V.ended=false;
  r.lang='ro-RO';r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  var inp=$('#ibotIn');if(inp){inp.value='';if(document.activeElement===inp)inp.blur()}
  var live=function(){return my===V.sess&&!V.ended};
  var started=function(){
    if(!live()||V.st!=='starting')return;
    clearTimeout(V.t1);vSet('listening');
    /* limită de siguranță: după 15 s oprim ascultarea, ca butonul să nu rămână blocat pe „Ascult…” */
    V.t2=setTimeout(function(){if(live()&&V.st==='listening'){try{r.stop()}catch(x){}V.t3=setTimeout(function(){vEnd(my)},2500)}},15000);
  };
  r.onstart=started;r.onaudiostart=started;
  r.onresult=function(e){
    if(!live())return;
    if(V.st==='starting')started();
    var f='',im='';
    for(var i=0;i<e.results.length;i++){var s=e.results[i][0].transcript;if(e.results[i].isFinal)f+=s;else im+=s}
    V.text=(f+im).replace(/\s+/g,' ').trim();
    var el=$('#ibotIn');if(el)el.value=V.text;
  };
  r.onerror=function(e){
    if(!live())return;
    V.err=e.error||'unknown';
    if(V.err==='not-allowed')micPerm='denied-session';
    clearTimeout(V.t3);V.t3=setTimeout(function(){vEnd(my)},1500);/* dacă browserul nu mai trimite onend */
  };
  r.onend=function(){vEnd(my)};
  vSet('starting');
  V.t1=setTimeout(function(){if(live()&&V.st==='starting'){V.err='start-timeout';vEnd(my)}},7000);
  try{r.start()}catch(x){V.err='start-failed';vEnd(my)}
}
/* Finalizarea unei sesiuni: rulează o singură dată pentru fiecare sesiune */
function vEnd(my){
  if(my!==V.sess||V.ended)return;
  V.ended=true;vClear();
  var err=V.err,txt=(V.text||'').trim(),manual=V.manual;
  V.err=null;vDetach();
  if(micPerm==='denied-session')micPerm='unknown';
  if(err&&err!=='no-speech'&&err!=='aborted'&&!txt){vSet('error',vErrMsg(err));return}
  if(!txt){
    if(manual)vSet('idle');
    else if(err==='aborted')vSet('error',vErrMsg('aborted'));
    else vSet('error','Nu am auzit nimic. Apasă din nou și vorbește după ce apare „Ascult…”.');
    return;
  }
  var inp=$('#ibotIn');
  if(manual){
    /* Oprirea manuală nu trimite nimic automat: textul rămâne în câmp pentru verificare */
    if(inp)inp.value=txt;
    vSet('idle','Am oprit ascultarea. Verifică textul și apasă „Trimite”.');
    return;
  }
  if(inp)inp.value='';
  vSet('processing');
  var done=function(){if(V.st==='processing'&&V.sess===my)vSet('idle')};
  sendFree(txt).then(done,done);
}
function vStopManual(){
  if(V.st!=='listening'&&V.st!=='starting')return;
  var my=V.sess;V.manual=true;
  try{V.rec&&V.rec.stop()}catch(x){}
  clearTimeout(V.t3);V.t3=setTimeout(function(){vEnd(my)},2500);
}
function vCancel(){
  if(V.st!=='listening'&&V.st!=='starting')return;
  var my=V.sess;V.manual=true;V.text='';V.err=null;
  var inp=$('#ibotIn');if(inp)inp.value='';
  vEnd(my);
}
document.addEventListener('visibilitychange',function(){if(document.hidden)vStopManual()});

var aiWait=false,popMsg=null,typer=null,lastSent={t:'',at:0};
function typeOut(m){
  var full=m.text,i=0,step=Math.max(1,Math.ceil(full.length/170));
  (function tick(){
    var el=document.querySelector('[data-typing] .tx');
    if(typer!==m||!el){if(typer===m)typer=null;return}
    i=Math.min(full.length,i+step);el.textContent=full.slice(0,i);
    var t=thr();if(t)t.scrollTop=t.scrollHeight;
    if(i<full.length)setTimeout(tick,18);else{typer=null;updBtn()}
  })();
}
function aiContext(){return {programari:S.sched.map(function(x){return {device_id:x.dev,peste_minute:Math.max(0,Math.round((x.at-Date.now())/60000)),actiune:x.on?'pornește':'oprește'}}),persoane:S.count,mod_off:!!S.off,pret_kwh_lei:S.price,camere:S.rooms.map(function(r){return {camera:r.name,echipamente:r.devices.map(function(d){return {id:d.id,nume:d.name,tip:tn(d),reglabil:isDim(d),aprins:!!d.on,intensitate:d.level,watt:d.watt||0,ore_pe_zi:d.hours||0,kwh_pe_zi:kwh(d),esential:!!d.essential,protejat:!!d.heart,minute_aprins:d.on&&d.since?Math.round((Date.now()-d.since)/60000):0}})}})}}
async function askAI(t){
  var hist=S.chat.filter(function(m){return m.me||m.free}).slice(-9,-1).map(function(m){return {role:m.me?'user':'assistant',content:m.text}});
  var r=await SB.functions.invoke('ibot',{body:{message:t,history:hist,context:aiContext()}});
  if(r.error||!r.data||r.data.error||!r.data.reply){console.warn('ibot AI:',r.error||(r.data&&r.data.error));return null}
  (r.data.actions||[]).forEach(function(a){
    var d=find(+a.device_id);if(!d)return;
    if(a.cancel){S.sched=S.sched.filter(function(x){return x.dev!=d.id});return}
    var am=+a.after_minutes||0;
    if(am>0&&typeof a.on==='boolean'){if(!(a.on===false&&d.essential))addSched(d,a.on,am);return}
    if(a.on===false&&d.essential)return;
    if(a.level!=null&&isDim(d)){d.level=Math.round(Math.min(1,Math.max(0,+a.level||0))*100)/100;if(d.level>0&&!d.on)setDev(d,true);else if(d.level===0&&d.on)setDev(d,false)}
    else if(typeof a.on==='boolean')setDev(d,a.on);
  });
  return r.data.reply;
}
async function sendFree(t){
  if(!t||!t.trim())return;t=t.trim();
  /* protecție împotriva trimiterii duble a aceluiași mesaj (dublu-click, Enter + buton, eveniment vocal dublat) */
  var now=Date.now();if(t===lastSent.t&&now-lastSent.at<2000)return;lastSent={t:t,at:now};
  var um={id:++uid,me:true,text:t,time:tm()};S.chat.push(um);popMsg=um;
  aiWait=true;userSentFlag=true;render();
  var txt=null;
  try{txt=await askAI(t)}catch(x){console.warn(x)}
  if(txt==null)txt=ibotReply(t);
  aiWait=false;
  var bm={id:++uid,free:true,text:txt,time:tm()};
  S.chat.push(bm);popMsg=bm;typer=bm;
  userSentFlag=true;render();typeOut(bm);
}

  return '<div class="mw">'+r+'</div>';

function chatItems(){
  var a=S.chat.length?S.chat.map(msgHtml):['<div class="mw"><div class="m bot">Nu am întrebări acum. Te anunț când un echipament stă aprins mai mult decât timpul setat.</div></div>'];
  if(aiWait)a.push(TYPING);
  return a;
}
function syncThread(t){
  var items=chatItems(),norm=function(x){return x.replace(' pop"','"')},prev=t._items||[],kids=t.children;
  if(kids.length!==prev.length){t.innerHTML=items.join('');t._items=items.map(norm);return}
  for(var i=0;i<items.length;i++){
    if(i>=prev.length)t.insertAdjacentHTML('beforeend',items[i]);
    else if(prev[i]!==norm(items[i])){var tmp=document.createElement('div');tmp.innerHTML=items[i];kids[i].replaceWith(tmp.firstElementChild)}
  }
  while(t.children.length>items.length)t.lastElementChild.remove();
  t._items=items.map(norm);
}

/* Actualizează doar ciorna, fără re-randare: cursorul și scrollul rămân pe loc */
function draftInput(t){
  var k=t.dataset&&t.dataset.k;if(!k||!D)return;
  var v=t.value,num=v===''?'':+v;
  var dev=t.dataset.d?dFind(t.dataset.d):null,room=t.dataset.r?dRoom(t.dataset.r):null,ty=t.dataset.t?dType(t.dataset.t):null;
  if(room&&k==='rn')room.name=v;
  else if(dev){
    if(k==='dn')dev.name=v;
    else if(k==='ty')dev.type=v;
    else if(k==='wt')dev.watt=num;
    else if(k==='hr')dev.hours=num;
    else if(k==='ck')dev.check=num;
    else if(k==='es')dev.essential=t.checked;
    else if(k==='ch'){var c=+v||null;
      if(c)D.rooms.forEach(function(rr){rr.devices.forEach(function(x){if(x!==dev&&x.channel===c){x.channel=null;var s=document.querySelector('#setEd select[data-k="ch"][data-d="'+x.id+'"]');if(s)s.value='0'}})});
      dev.channel=c}
  }else if(ty){
    if(k==='tn')ty.name=v;
    else if(k==='tw')ty.default_watt=num;
    else if(k==='th')ty.default_hours=num;
    else if(k==='td')ty.dimmable=t.checked;
  }
  t.classList.remove('bad');t.removeAttribute('aria-invalid');
  updSaveBar();
}
function validate(){
  var bad={},msgs=[];
  var chk=function(key,cond,msg){if(!cond){bad[key]=1;if(msgs.indexOf(msg)<0)msgs.push(msg)}};
  var okN=function(v,max,int){return v!==''&&v!=null&&isFinite(v)&&+v>=0&&+v<=max&&(!int||Math.round(v)==v)};
  D.types.forEach(function(t){
    chk('tn:'+t.id,String(t.name||'').trim(),'Fiecare tip trebuie să aibă un nume.');
    chk('tw:'+t.id,okN(t.default_watt,100000),'Puterea implicită trebuie să fie între 0 și 100000 W.');
    chk('th:'+t.id,okN(t.default_hours,24),'Orele implicite trebuie să fie între 0 și 24.');
  });
  D.rooms.forEach(function(r){
    chk('rn:'+r.id,String(r.name||'').trim(),'Fiecare cameră trebuie să aibă un nume.');
    r.devices.forEach(function(d){
      chk('dn:'+d.id,String(d.name||'').trim(),'Fiecare echipament trebuie să aibă un nume.');

function applyDraft(){

  S.types=D.types.map(function(t){var n=Object.assign({},t);n.name=String(n.name).trim();n.default_watt=+n.default_watt;n.default_hours=+n.default_hours;return n});

function show(v){$('#login').classList.toggle('hide',v);$('#app').classList.toggle('hide',!v);if(v)render()}
async function enter(){
  try{await load()}catch(x){await SB.auth.signOut();$('#lerr').textContent=x.message||'Eroare la încărcare.';show(false);return}
  ready=true;D=null;show(true);subscribe();
}
$('#lf').onsubmit=async function(e){e.preventDefault();$('#lerr').textContent='';var r=await SB.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(r.error){$('#lerr').textContent='Email sau parolă greșite.';return}enter()};
$('#out').onclick=async function(){
  if(isDirty()&&!await askConfirm({title:'Ieși din cont?',text:'Ai modificări nesalvate în Setări. Dacă ieși acum, se vor pierde.',yes:'Ieși fără să salvez',no:'Rămân',danger:true}))return;
  vCancel();
  if(timer){await flush()}
  ready=false;D=null;if(rt)SB.removeChannel(rt);await SB.auth.signOut();show(false);
};
SB.auth.getSession().then(function(r){if(r.data&&r.data.session)enter()});

setInterval(function(){
  var ch=false,now=Date.now();
  S.rooms.forEach(function(r){r.devices.forEach(function(d){
    if(d.on&&d.heartUntil&&now>=d.heartUntil){setDev(d,false);sys(d.name+': programul s-a terminat, priza a fost oprită.');ch=true}
    if(d.on&&d.check>0&&!d.asked&&d.since&&(now-d.since)/1000*SCALE/60>=d.check){
      d.asked=true;S.chat.push({id:++uid,dev:d.id,text:'Mai folosești '+d.name.toLowerCase()+'? Nu a mai fost stinsă de '+d.check+' minute.',time:tm(),done:null});ch=true}
  })});
  if(S.sched.length){var due=S.sched.filter(function(x){return x.at<=now});
    if(due.length){S.sched=S.sched.filter(function(x){return x.at>now});due.forEach(function(x){var d=find(x.dev);if(!d)return;if(!x.on&&d.essential)return;setDev(d,x.on);sys('Programare executată: am '+(x.on?'pornit ':'oprit ')+d.name.toLowerCase()+'.')});ch=true}}
  if(ch&&!$('#app').classList.contains('hide')&&view!=='set')render();else if(ch){updDot();save()}
},1000);
})();
</script>
</body>
</html>
